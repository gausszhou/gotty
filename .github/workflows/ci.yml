name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Configure pnpm store
        # 显式固定 store-dir,并创建 pnpm store path 解析出的精确目录
        # (store-dir 会有 /v3 版本子目录),确保 setup-node 的缓存
        # 路径解析成功,避免 "Some specified paths were not resolved"
        run: |
          pnpm config set store-dir "${{ runner.temp }}/pnpm-store"
          mkdir -p "$(pnpm store path)"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: make install

      - name: Test
        run: make test

      - name: Build
        run: make build

      - name: Verify binary runs
        run: ./gotty --version
