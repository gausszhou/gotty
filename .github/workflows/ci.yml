name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Configure pnpm store
        # 显式固定 store-dir,确保 setup-node 解析出的缓存路径与 pnpm install 实际使用的
        # 路径一致且预先存在,避免 post 步骤 "Some specified paths were not resolved"
        # (见 actions/setup-node#1137 / #543)
        run: |
          pnpm config set store-dir "${{ runner.temp }}/pnpm-store"
          mkdir -p "${{ runner.temp }}/pnpm-store"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: make install

      - name: Test
        run: make test

      - name: Build
        run: make build

      - name: Verify binary runs
        run: ./gotty --version
